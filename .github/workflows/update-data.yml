name: Actualizar referencia de precios
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Guardar cambios
        run: |
          git config user.name "precio-eucalipto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Actualizar referencia de precios"
          git push
